site_name: Idle Heroes Wiki
site_url: https://mjvavra.github.io/idle_heroes/
repo_url: https://github.com/mjvavra/idle_heroes
docs_dir: _site_src

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - toc:
      permalink: true
